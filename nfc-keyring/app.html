<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>콕태그 앱</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#ff5e7e">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: phone-width app shell — app bar, one scrolling screen per tab, floating add button, fixed bottom tab bar; bottom sheets for add/buy/viewer */
:root {
  --bg: #f3f4fa; --surface: #ffffff; --ink: #1d1f2e; --muted: #737891; --line: #e4e6f0;
  --accent: #ff5e7e; --accent-ink: #ffffff; --accent-soft: #ffe4ea;
  --tint-dog: #ffe1c4; --tint-cat: #d9edff; --tint-dog-ink: #8a4c1f; --tint-cat-ink: #2c5785;
  --ok: #1f8a5b;
  --font-display: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --tabbar: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101119; --surface: #1c1e2b; --ink: #eef0f8; --muted: #9fa4bc; --line: #2d3044;
    --accent: #ff7a95; --accent-ink: #2b0710; --accent-soft: #3a1a24;
    --tint-dog: #3d2b1d; --tint-cat: #1b2c42; --tint-dog-ink: #ffcf9f; --tint-cat-ink: #a9d2ff; --ok: #6fdba8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101119; --surface: #1c1e2b; --ink: #eef0f8; --muted: #9fa4bc; --line: #2d3044;
  --accent: #ff7a95; --accent-ink: #2b0710; --accent-soft: #3a1a24;
  --tint-dog: #3d2b1d; --tint-cat: #1b2c42; --tint-dog-ink: #ffcf9f; --tint-cat-ink: #a9d2ff; --ok: #6fdba8;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55; }
body[data-kind="dog"] { --tint: var(--tint-dog); --tint-ink: var(--tint-dog-ink); }
body[data-kind="cat"] { --tint: var(--tint-cat); --tint-ink: var(--tint-cat-ink); }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 10px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; margin: 0; line-height: 1.25; }

.shell { max-width: 440px; margin: 0 auto; min-height: 100%; background: var(--bg); position: relative; }
@media (min-width: 600px) { body { background: color-mix(in srgb, var(--bg) 70%, var(--line)); } .shell { box-shadow: 0 0 0 1px var(--line), 0 20px 60px rgba(0,0,0,.12); } }

/* app bar */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
.appbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.appbar h1 { font-size: 24px; }
.petswitch { display: flex; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px; }
.petswitch button { border: 0; background: transparent; border-radius: 999px; padding: 4px 10px 4px 4px; display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 14px; color: var(--muted); }
.petswitch button svg { width: 28px; height: 28px; border-radius: 50%; background: var(--line); }
.petswitch button.on { background: var(--tint); color: var(--tint-ink); font-weight: 700; }

.screen { padding-bottom: calc(var(--tabbar) + 90px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 16px; }

/* home */
.hero { background: var(--tint); border-radius: 26px; padding: 18px; display: grid; grid-template-columns: 96px 1fr; gap: 14px; align-items: center; position: relative; overflow: hidden; }
.hero .av { width: 96px; height: 96px; border-radius: 50%; background: var(--surface); overflow: hidden; display: grid; place-items: center; }
.hero .av svg { width: 115%; height: 115%; margin-top: 12%; }
.hero h2 { font-size: 28px; color: var(--tint-ink); }
.hero p { margin: 2px 0 0; color: var(--tint-ink); opacity: .85; font-size: 13px; }
.dday { display: inline-block; margin-top: 8px; background: var(--surface); color: var(--ink); border-radius: 999px; padding: 3px 12px; font-family: var(--font-display); font-size: 16px; font-variant-numeric: tabular-nums; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--surface); border-radius: 20px; border: 1px solid var(--line); }
.stats div { text-align: center; padding: 12px 6px; }
.stats div + div { border-left: 1px solid var(--line); }
.stats b { display: block; font-family: var(--font-display); font-weight: 400; font-size: 22px; font-variant-numeric: tabular-nums; }
.stats span { font-size: 12px; color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; overflow: hidden; }
.today .img { aspect-ratio: 16 / 10; max-width: 100%; overflow: hidden; }
.today .img svg, .today .img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.today .txt { padding: 12px 16px 14px; }
.label { font-size: 12px; color: var(--accent); font-weight: 700; letter-spacing: .04em; }
.today h3 { font-size: 20px; }
.sec { display: flex; justify-content: space-between; align-items: baseline; }
.sec h3 { font-size: 20px; }
.sec button { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 13px; }
.post { display: grid; }
.post .head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; }
.post .head svg { width: 34px; height: 34px; border-radius: 50%; background: var(--tint); }
.post .head b { font-weight: 700; font-size: 14px; display: block; }
.post .head small { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.post .img { aspect-ratio: 1; max-width: 100%; overflow: hidden; }
.post .img svg, .post .img img, .post .img video { width: 100%; height: 100%; object-fit: cover; display: block; }
.post .body { padding: 10px 14px 14px; display: grid; gap: 4px; }
.post .acts { display: flex; gap: 6px; }
.post .acts button { border: 0; background: none; cursor: pointer; font-size: 22px; padding: 2px 4px; line-height: 1; color: var(--ink); }
.post .acts button.liked { color: var(--accent); }
.post h4 { margin: 0; font-size: 15px; }
.post p { margin: 0; color: var(--muted); font-size: 14px; }

/* album */
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px; }
.seg button { border: 0; background: transparent; border-radius: 10px; padding: 8px; cursor: pointer; color: var(--muted); font-weight: 500; }
.seg button.on { background: var(--accent); color: var(--accent-ink); }
.agrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; border-radius: 16px; overflow: hidden; }
.agrid button { border: 0; padding: 0; aspect-ratio: 1; max-width: 100%; overflow: hidden; cursor: pointer; position: relative; background: var(--tint); }
.agrid svg, .agrid img, .agrid video { width: 100%; height: 100%; object-fit: cover; display: block; }
.agrid .badge { position: absolute; right: 5px; bottom: 5px; background: rgba(0,0,0,.6); color: #fff; font-size: 11px; padding: 0 6px; border-radius: 6px; font-variant-numeric: tabular-nums; }
.agrid .mine { position: absolute; left: 5px; top: 5px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); border: 2px solid #fff; }
.empty { text-align: center; color: var(--muted); padding: 30px 10px; }

/* shop */
.pcard { display: grid; grid-template-columns: 110px 1fr; gap: 14px; padding: 14px; align-items: center; }
.pcard .pic { background: var(--bg); border-radius: 16px; padding: 6px; }
.pcard svg { width: 100%; height: auto; display: block; }
.pcard h3 { font-size: 19px; }
.pcard p { margin: 2px 0 8px; color: var(--muted); font-size: 13px; }
.price { font-family: var(--font-display); font-size: 20px; font-variant-numeric: tabular-nums; }
.pill { border: 0; background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 7px 16px; cursor: pointer; font-family: var(--font-display); font-size: 16px; }
.banner { background: var(--accent-soft); border-radius: 20px; padding: 16px; display: grid; gap: 4px; }
.banner b { font-family: var(--font-display); font-weight: 400; font-size: 19px; color: var(--accent); }
.banner span { font-size: 13px; color: var(--muted); }

/* tag */
.tagcard { padding: 18px; display: grid; gap: 12px; }
.tagcard .kr { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; background: var(--tint); border-radius: 18px; padding: 10px; }
.tagcard .kr svg { width: 100%; height: auto; display: block; }
.url { display: flex; gap: 8px; align-items: center; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 8px 8px 8px 12px; }
.url code { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
.url button { border: 0; background: var(--ink); color: var(--bg); border-radius: 9px; padding: 6px 12px; cursor: pointer; font-size: 13px; flex: none; }
.big { border: 0; width: 100%; border-radius: 16px; padding: 14px; font-family: var(--font-display); font-size: 18px; cursor: pointer; background: var(--accent); color: var(--accent-ink); display: flex; align-items: center; justify-content: center; gap: 8px; }
.big.alt { background: var(--surface); color: var(--ink); border: 1.5px solid var(--line); }
.nfcstate { display: grid; place-items: center; gap: 10px; padding: 18px; text-align: center; }
.ring { width: 110px; height: 110px; border-radius: 50%; background: var(--accent-soft); display: grid; place-items: center; position: relative; }
.ring::before, .ring::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--accent); opacity: 0; animation: ripple 2s infinite; }
.ring::after { animation-delay: 1s; }
@keyframes ripple { from { transform: scale(.8); opacity: .7; } to { transform: scale(1.5); opacity: 0; } }
.ring svg { width: 52px; height: 52px; }
.steps { margin: 0; padding-left: 20px; color: var(--muted); font-size: 14px; display: grid; gap: 4px; }

/* fab + tabbar */
.fab { position: fixed; z-index: 21; width: 58px; height: 58px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); font-size: 30px; cursor: pointer; box-shadow: 0 8px 20px color-mix(in srgb, var(--accent) 45%, transparent);
  bottom: calc(var(--tabbar) + 16px + env(safe-area-inset-bottom, 0px)); right: max(16px, calc((100vw - 440px) / 2 + 16px), calc(16px + env(safe-area-inset-right, 0px))); }
.tabbar { position: fixed; z-index: 22; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 440px; background: var(--surface); border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(4, 1fr); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tabbar button { border: 0; background: none; height: var(--tabbar); display: grid; place-items: center; align-content: center; gap: 2px; cursor: pointer; color: var(--muted); font-size: 11px; }
.tabbar svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tabbar button.on { color: var(--accent); }
.tabbar button.on svg { fill: color-mix(in srgb, var(--accent) 18%, transparent); }

/* sheets */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(10, 10, 20, .5); }
.sheet { position: fixed; z-index: 41; left: 50%; bottom: 0; transform: translateX(-50%); width: 100%; max-width: 440px; max-height: 88vh; overflow-y: auto; background: var(--surface); border-radius: 26px 26px 0 0;
  padding: 10px 18px calc(20px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; }
.sheet.enter { animation: up .25s ease-out; }
@keyframes up { from { transform: translate(-50%, 40px); opacity: 0; } }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); justify-self: center; }
.sheet h2 { font-size: 22px; }
.sheet label { display: grid; gap: 6px; font-size: 13px; color: var(--muted); }
.sheet .text { background: var(--bg); border: 1.5px solid var(--line); border-radius: 12px; padding: 11px 12px; width: 100%; }
.pick { border: 2px dashed var(--line); border-radius: 16px; padding: 18px; text-align: center; color: var(--muted); cursor: pointer; display: block; }
.pick.has { border-color: var(--accent); color: var(--ink); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chips button { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; cursor: pointer; font-size: 14px; }
.chips button.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.total { display: flex; justify-content: space-between; align-items: baseline; border-top: 1px dashed var(--line); padding-top: 12px; }
.total b { font-family: var(--font-display); font-weight: 400; font-size: 24px; font-variant-numeric: tabular-nums; }
.note { font-size: 12px; color: var(--muted); margin: 0; }
.viewer { position: fixed; inset: 0; z-index: 50; background: #000; display: grid; grid-template-rows: auto 1fr auto; color: #fff; }
.viewer .vtop { display: flex; justify-content: space-between; align-items: center; padding: calc(10px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); }
.viewer .vtop button, .viewer .vnav button { border: 0; background: rgba(255,255,255,.15); color: #fff; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; font-size: 18px; }
.viewer .vimg { display: grid; place-items: center; overflow: hidden; touch-action: pan-y; }
.viewer .vimg > * { width: 100%; max-width: 600px; max-height: 100%; aspect-ratio: 1; object-fit: contain; }
.viewer .vnav { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.viewer .vnav div { text-align: center; min-width: 0; }
.viewer .vnav b { font-family: var(--font-display); font-weight: 400; font-size: 18px; display: block; }
.viewer .vnav small { opacity: .7; }
.toast { position: fixed; z-index: 60; left: 50%; transform: translateX(-50%); bottom: calc(var(--tabbar) + 90px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-size: 14px; white-space: nowrap; max-width: calc(100vw - 32px); overflow: hidden; text-overflow: ellipsis; }
@media (prefers-reduced-motion: reduce) { .ring::before, .ring::after, .sheet { animation: none; } }
</style>
</head>
<body data-kind="dog">
<div class="shell">
  <header class="appbar">
    <h1 id="title">콕태그</h1>
    <div class="petswitch" id="petswitch" role="tablist" aria-label="반려동물 선택"></div>
  </header>

  <main class="screen" id="screen-home"></main>
  <main class="screen" id="screen-album" hidden></main>
  <main class="screen" id="screen-shop" hidden></main>
  <main class="screen" id="screen-tag" hidden></main>
</div>

<button class="fab" id="fab" type="button" aria-label="추억 추가">＋</button>

<nav class="tabbar" id="tabbar" aria-label="하단 메뉴">
  <button type="button" data-tab="home" class="on"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>홈</button>
  <button type="button" data-tab="album"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="M21 16l-5-5L5 21"/></svg>앨범</button>
  <button type="button" data-tab="shop"><svg viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>스토어</button>
  <button type="button" data-tab="tag"><svg viewBox="0 0 24 24"><circle cx="12" cy="14" r="6"/><path d="M12 8V3"/><circle cx="12" cy="3" r="1.5"/><path d="M9.5 14a2.5 2.5 0 0 1 5 0"/></svg>내 키링</button>
</nav>

<div id="layer"></div>
<div class="toast" id="toast" hidden></div>

<input type="file" id="file" accept="image/*,video/*" multiple hidden>

<script src="art.js"></script>
<script src="data.js"></script>
<script src="store.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const A = window.KokArt, D = window.KOK, S = window.KokStore;
  const won = (n) => n.toLocaleString("ko-KR") + "원";
  const dot = (d) => d.replace(/-/g, ".");
  const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const days = (d) => Math.floor((Date.now() - new Date(d + "T00:00:00")) / 86400000);

  const VALID_TABS = ["home", "album", "shop", "tag"];
  let petId = "choco", tab = "home", albumMode = "photo", mine = [], urls = [];
  try { const saved = localStorage.getItem("kok-app-pet"); if (D.pets[saved]) petId = saved; } catch (_) {}
  const h = location.hash.slice(1);
  if (VALID_TABS.includes(h)) tab = h;
  const pet = () => D.pets[petId];

  function toast(m) { const t = $("toast"); t.textContent = m; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => (t.hidden = true), 2200); }
  function media(item, opts) {
    if (item.blob) {
      const u = URL.createObjectURL(item.blob); urls.push(u);
      return item.type === "video" ? `<video src="${u}" ${opts && opts.controls ? "controls autoplay" : "muted"} playsinline></video>` : `<img src="${u}" alt="${esc(item.caption || "추억")}">`;
    }
    return A.photoSVG(pet().kind, item.scene, { date: opts && opts.date ? item.date : null, animate: opts && opts.animate });
  }
  function head(kind) { return `<svg viewBox="0 0 300 300">${A.petArt(kind)}</svg>`; }
  function memoryUrl() {
    const base = location.href.split("#")[0].split("?")[0].replace(/[^/]*$/, "");
    return base + "memory.html?pet=" + petId;
  }
  function liked(key) { try { return localStorage.getItem("kok-liked-" + key) === "1"; } catch (_) { return false; } }
  function setLiked(key, v) { try { localStorage.setItem("kok-liked-" + key, v ? "1" : "0"); } catch (_) {} }

  // ---------- pet switch ----------
  function renderSwitch() {
    $("petswitch").innerHTML = Object.entries(D.pets).map(([id, p]) =>
      `<button type="button" role="tab" aria-selected="${id === petId}" class="${id === petId ? "on" : ""}" data-pet="${id}">${head(p.kind)}${p.name}</button>`).join("");
  }
  $("petswitch").addEventListener("click", (e) => {
    const b = e.target.closest("[data-pet]"); if (!b) return;
    petId = b.dataset.pet; try { localStorage.setItem("kok-app-pet", petId); } catch (_) {}
    renderAll();
  });

  // ---------- screens ----------
  function photos() { return [...mine.filter((m) => m.type === "photo").map((m) => ({ ...m, mine: true })), ...pet().photos]; }
  function videos() { return [...mine.filter((m) => m.type === "video").map((m) => ({ ...m, mine: true })), ...pet().videos]; }

  function renderHome() {
    const p = pet();
    const all = photos();
    const today = all[new Date().getDate() % all.length];
    const yearsAgo = new Date().getFullYear() - Number(today.date.slice(0, 4));
    const feed = [
      ...mine.map((m) => ({ key: m.id, date: m.date, title: m.caption || "새 추억", text: "", item: m })),
      ...p.timeline.map((t, i) => ({ key: petId + "-t" + i, date: t.date, title: t.title, text: t.text, item: { scene: t.scene, date: t.date } })),
    ].sort((a, b) => b.date.localeCompare(a.date));
    $("screen-home").innerHTML = `
      <section class="hero">
        <div class="av">${head(p.kind)}</div>
        <div><h2>${esc(p.name)}</h2><p>${esc(p.breed)} · ${dot(p.birthday)}생</p><span class="dday">D+${days(p.together).toLocaleString()}</span></div>
      </section>
      <div class="stats"><div><b>${all.length}</b><span>사진</span></div><div><b>${videos().length}</b><span>영상</span></div><div><b>${S.likes(petId)}</b><span>받은 하트</span></div></div>
      <article class="card today">
        <div class="img">${media(today)}</div>
        <div class="txt"><span class="label">${yearsAgo > 0 ? yearsAgo + "년 전 추억" : "오늘의 추억"}</span><h3>${esc(today.caption || "새 추억")}</h3></div>
      </article>
      <div class="sec"><h3>우리 이야기</h3><button type="button" data-go="album">전체 앨범 →</button></div>
      ${feed.map((f) => `
        <article class="card post">
          <div class="head">${head(p.kind)}<div><b>${esc(p.name)}</b><small>${dot(f.date)}</small></div></div>
          <div class="img">${media(f.item)}</div>
          <div class="body">
            <div class="acts"><button type="button" class="${liked(f.key) ? "liked" : ""}" data-like="${f.key}" aria-label="좋아요">${liked(f.key) ? "♥" : "♡"}</button></div>
            <h4>${esc(f.title)}</h4>${f.text ? `<p>${esc(f.text)}</p>` : ""}
          </div>
        </article>`).join("")}`;
  }

  function renderAlbum() {
    const list = albumMode === "photo" ? photos() : videos();
    $("screen-album").innerHTML = `
      <div class="seg" role="tablist"><button type="button" class="${albumMode === "photo" ? "on" : ""}" data-mode="photo">사진 ${photos().length}</button><button type="button" class="${albumMode === "video" ? "on" : ""}" data-mode="video">영상 ${videos().length}</button></div>
      ${list.length ? `<div class="agrid">${list.map((it, i) => `
        <button type="button" data-view="${i}" aria-label="${esc(it.caption || it.title || "추억")} 보기">
          ${media(it)}${it.mine ? '<span class="mine"></span>' : ""}${albumMode === "video" ? `<span class="badge">▶ ${it.duration || ""}</span>` : ""}
        </button>`).join("")}</div>` : `<p class="empty">아직 없어요. 아래 ＋ 버튼으로 추가해 보세요.</p>`}
      <p class="note">빨간 점은 직접 올린 추억이에요. 샘플 영상은 그림이 움직이는 미리보기예요.</p>`;
  }

  function renderShop() {
    $("screen-shop").innerHTML = `
      <div class="banner"><b>첫 주문 배송비 무료</b><span>4만원 이상 주문하면 언제나 무료배송이에요.</span></div>
      ${D.shop.products.map((p) => `
        <article class="card pcard">
          <div class="pic">${A.keyringSVG(p.kind, "front", { id: "s" })}</div>
          <div><h3>${p.name}</h3><p>${p.desc}<br>이름 새기기 가능</p>
            <div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span class="price">${won(p.price)}</span><button class="pill" type="button" data-buy="${p.id}">구매</button></div></div>
        </article>`).join("")}
      <article class="card pcard">
        <div class="pic">${A.keyringSVG("dog", "back", { id: "s2" })}</div>
        <div><h3>앨범 플러스</h3><p>사진·영상 무제한, 1년간 무료 수정</p><span class="price">+${won(D.shop.plans[1].add)}</span></div>
      </article>`;
  }

  function renderTag() {
    const p = pet();
    const canWrite = "NDEFReader" in window;
    $("screen-tag").innerHTML = `
      <article class="card tagcard">
        <h3>${esc(p.name)}의 키링</h3>
        <div class="kr">${A.keyringSVG(p.kind, "front", { id: "t" })}${A.keyringSVG(p.kind, "back", { id: "t", name: p.nameEn })}</div>
        <span class="label">키링에 담긴 주소</span>
        <div class="url"><code id="tagUrl">${esc(memoryUrl())}</code><button type="button" id="copyUrl">복사</button></div>
        <button class="big alt" type="button" id="openMem">키링을 댄 것처럼 열어보기</button>
      </article>
      <article class="card tagcard">
        <h3>키링에 주소 쓰기</h3>
        <div class="nfcstate" id="nfcState" hidden><div class="ring"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M19.5 9a4 4 0 0 1 0 6M4.5 9a4 4 0 0 0 0 6"/></svg></div><b>휴대폰 뒷면에 키링을 대주세요</b><span class="note">다 쓰면 진동과 함께 알려드려요.</span></div>
        ${canWrite
          ? `<button class="big" type="button" id="writeTag">NFC 키링에 쓰기</button><p class="note">안드로이드 크롬에서 동작해요. 새 NFC 칩(NTAG213/215)에 이 앨범 주소를 기록합니다.</p>`
          : `<p class="note">이 기기에서는 웹에서 바로 쓸 수 없어요. 아래 방법으로 쓰면 돼요.</p>
             <ol class="steps"><li>앱스토어에서 무료 앱 <b>NFC Tools</b>를 설치해요.</li><li>쓰기 → 레코드 추가 → URL을 고르고 위 주소를 붙여넣어요.</li><li>쓰기를 누르고 키링 뒷면에 휴대폰을 대면 끝이에요.</li></ol>`}
      </article>`;
  }

  function renderAll() {
    urls.forEach(URL.revokeObjectURL); urls = [];
    document.body.dataset.kind = pet().kind;
    renderSwitch();
    return S.list(petId).then((rows) => {
      mine = rows;
      renderHome(); renderAlbum(); renderShop(); renderTag();
      showTab(tab, true);
    });
  }

  function showTab(t, silent) {
    tab = t;
    VALID_TABS.forEach((n) => { $("screen-" + n).hidden = n !== t; });
    document.querySelectorAll(".tabbar button").forEach((b) => b.classList.toggle("on", b.dataset.tab === t));
    $("fab").hidden = !(t === "home" || t === "album");
    $("title").textContent = { home: "콕태그", album: "앨범", shop: "스토어", tag: "내 키링" }[t];
    if (!silent) { scrollTo(0, 0); try { history.replaceState(null, "", "#" + t); } catch (_) {} }
  }
  $("tabbar").addEventListener("click", (e) => { const b = e.target.closest("[data-tab]"); if (b) showTab(b.dataset.tab); });
  addEventListener("hashchange", () => { const n = location.hash.slice(1); if (VALID_TABS.includes(n)) showTab(n, true); });

  // ---------- delegated actions ----------
  document.addEventListener("click", async (e) => {
    const t = e.target;
    const go = t.closest("[data-go]"); if (go) return showTab(go.dataset.go);
    const like = t.closest("[data-like]");
    if (like) {
      const k = like.dataset.like, v = !liked(k); setLiked(k, v);
      if (v) S.like(petId);
      like.classList.toggle("liked", v); like.textContent = v ? "♥" : "♡";
      return;
    }
    const mode = t.closest("[data-mode]"); if (mode) { albumMode = mode.dataset.mode; renderAlbum(); return; }
    const view = t.closest("[data-view]"); if (view) return openViewer(Number(view.dataset.view));
    const buy = t.closest("[data-buy]"); if (buy) return openBuy(buy.dataset.buy);
    if (t.closest("#copyUrl")) {
      try { await navigator.clipboard.writeText(memoryUrl()); toast("주소를 복사했어요"); }
      catch (_) { const r = document.createRange(); r.selectNodeContents($("tagUrl")); getSelection().removeAllRanges(); getSelection().addRange(r); toast("주소를 선택했어요. 길게 눌러 복사하세요"); }
      return;
    }
    if (t.closest("#openMem")) { location.href = "memory.html?pet=" + petId + "#" + petId; return; }
    if (t.closest("#writeTag")) return writeTag();
  });

  // ---------- NFC write (Web NFC, Android Chrome) ----------
  async function writeTag() {
    const st = $("nfcState"); st.hidden = false;
    try {
      const nd = new NDEFReader();
      await nd.write({ records: [{ recordType: "url", data: memoryUrl() }] });
      st.hidden = true; toast("키링에 주소를 썼어요!");
      if (navigator.vibrate) navigator.vibrate(120);
    } catch (err) {
      st.hidden = true;
      toast(err && err.name === "NotAllowedError" ? "NFC 권한을 허용해 주세요" : "쓰기에 실패했어요. 키링을 다시 대주세요");
    }
  }

  // ---------- sheets ----------
  function closeLayer() { $("layer").innerHTML = ""; }
  function sheet(html) {
    const enter = !$("layer").querySelector(".sheet");
    $("layer").innerHTML = `<div class="scrim" data-close></div><div class="sheet${enter ? " enter" : ""}" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div>`;
    $("layer").querySelector("[data-close]").onclick = closeLayer;
  }

  // add memory
  let picked = [];
  $("fab").onclick = () => {
    picked = [];
    sheet(`<h2>추억 추가하기</h2>
      <label class="pick" id="pick" for="file"><span id="pickText">눌러서 사진·영상 고르기</span></label>
      <label for="cap">한 줄 설명<input class="text" id="cap" maxlength="40" placeholder="예: 처음 눈 본 날"></label>
      <label for="dt">날짜<input class="text" id="dt" type="date" value="${new Date().toISOString().slice(0, 10)}"></label>
      <p class="note">미리보기에서는 이 기기에만 저장돼요. 실제 서비스에서는 서버에 저장되어 키링을 대는 모두가 봐요.</p>
      <button class="big" type="button" id="saveMem">저장하기</button>`);
    $("saveMem").onclick = async () => {
      if (!picked.length) return toast("사진이나 영상을 먼저 골라주세요");
      try {
        for (const f of picked) await S.add(petId, f, $("cap").value.trim(), $("dt").value);
        closeLayer(); toast(`추억 ${picked.length}개를 저장했어요`); renderAll();
      } catch (_) { toast("이 브라우저에서는 저장할 수 없어요"); }
    };
  };
  $("file").onchange = (e) => {
    picked = [...e.target.files]; e.target.value = "";
    if ($("pickText")) { $("pickText").textContent = picked.length ? picked.length + "개 선택됨" : "눌러서 사진·영상 고르기"; $("pick").classList.toggle("has", picked.length > 0); }
  };

  // buy
  function openBuy(pid) {
    const p = D.shop.products.find((x) => x.id === pid);
    const o = { plan: "basic", engrave: true, qty: 1 };
    const draw = () => {
      const plan = D.shop.plans.find((x) => x.id === o.plan);
      const sub = (p.price + plan.add + (o.engrave ? D.shop.engrave : 0)) * o.qty;
      const ship = sub >= D.shop.freeShippingOver ? 0 : D.shop.shipping;
      sheet(`<h2>${p.name}</h2>
        <div id="bprev" style="display:grid;grid-template-columns:1fr 1fr;gap:8px">${A.keyringSVG(p.kind, "front", { id: "b" })}${A.keyringSVG(p.kind, "back", { id: "b", name: o.engrave ? o.name || (p.kind === "cat" ? "NABI" : "CHOCO") : " " })}</div>
        <label>플랜<div class="chips">${D.shop.plans.map((x) => `<button type="button" class="${x.id === o.plan ? "on" : ""}" data-plan="${x.id}">${x.name}${x.add ? " +" + won(x.add) : ""}</button>`).join("")}</div></label>
        <label>이름 새기기 (+${won(D.shop.engrave)})<div class="chips"><button type="button" class="${o.engrave ? "on" : ""}" data-eng="1">새길래요</button><button type="button" class="${!o.engrave ? "on" : ""}" data-eng="0">안 새길래요</button></div></label>
        ${o.engrave ? `<label for="bn">새길 이름 (영문 10자)<input class="text" id="bn" maxlength="10" value="${esc(o.name || "")}" placeholder="CHOCO" autocomplete="off"></label>` : ""}
        <label>수량<div class="chips"><button type="button" data-q="-1">−</button><button type="button" class="on" disabled>${o.qty}개</button><button type="button" data-q="1">＋</button></div></label>
        <div class="total"><span>합계 ${ship ? "(배송비 " + won(ship) + " 포함)" : "(무료배송)"}</span><b>${won(sub + ship)}</b></div>
        <button class="big" type="button" id="pay">결제하기</button>
        <p class="note">미리보기라 실제 결제는 되지 않아요.</p>`);
      const layer = $("layer");
      layer.querySelectorAll("[data-plan]").forEach((b) => (b.onclick = () => { o.plan = b.dataset.plan; draw(); }));
      layer.querySelectorAll("[data-eng]").forEach((b) => (b.onclick = () => { o.engrave = b.dataset.eng === "1"; draw(); }));
      layer.querySelectorAll("[data-q]").forEach((b) => (b.onclick = () => { o.qty = Math.min(20, Math.max(1, o.qty + Number(b.dataset.q))); draw(); }));
      const bn = $("bn");
      if (bn) bn.oninput = () => {
        const v = bn.value.toUpperCase().replace(/[^A-Z0-9 .\-]/g, "").slice(0, 10);
        o.name = v; bn.value = v;
        layer.querySelectorAll("#bprev svg")[1].outerHTML = A.keyringSVG(p.kind, "back", { id: "b", name: v || (p.kind === "cat" ? "NABI" : "CHOCO") });
      };
      $("pay").onclick = () => {
        sheet(`<div style="text-align:center;display:grid;gap:10px;justify-items:center;padding:10px 0">
          <div style="width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:30px;background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)">✓</div>
          <h2>주문서가 작성되었어요</h2><p class="note">실제 서비스에서는 여기서 카드·간편결제 창이 열려요.<br>${p.name} × ${o.qty} · ${won(sub + ship)}</p>
          <button class="big" type="button" data-close>확인</button></div>`);
        $("layer").querySelectorAll("[data-close]").forEach((b) => (b.onclick = closeLayer));
      };
    };
    draw();
  }

  // viewer
  function openViewer(i) {
    const list = albumMode === "photo" ? photos() : videos();
    let idx = i;
    const draw = () => {
      const it = list[idx];
      $("layer").innerHTML = `<div class="viewer" role="dialog" aria-modal="true" aria-label="크게 보기">
        <div class="vtop"><span>${idx + 1} / ${list.length}</span><div style="display:flex;gap:8px">${it.mine ? '<button type="button" id="vDel" aria-label="삭제">🗑</button>' : ""}<button type="button" id="vClose" aria-label="닫기">✕</button></div></div>
        <div class="vimg" id="vimg">${media(it, { controls: true, date: true, animate: albumMode === "video" })}</div>
        <div class="vnav"><button type="button" id="vPrev" aria-label="이전">‹</button><div><b>${esc(it.caption || it.title || "새 추억")}</b><small>${dot(it.date)}</small></div><button type="button" id="vNext" aria-label="다음">›</button></div></div>`;
      $("vClose").onclick = closeLayer;
      $("vPrev").onclick = () => { idx = (idx - 1 + list.length) % list.length; draw(); };
      $("vNext").onclick = () => { idx = (idx + 1) % list.length; draw(); };
      if ($("vDel")) $("vDel").onclick = async () => { await S.remove(it.id); closeLayer(); toast("삭제했어요"); renderAll(); };
      let sx = null;
      $("vimg").addEventListener("touchstart", (e) => { sx = e.touches[0].clientX; }, { passive: true });
      $("vimg").addEventListener("touchend", (e) => {
        if (sx === null) return; const dx = e.changedTouches[0].clientX - sx; sx = null;
        if (Math.abs(dx) > 50) { idx = (idx + (dx < 0 ? 1 : -1) + list.length) % list.length; draw(); }
      });
    };
    draw();
  }
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && $("layer").innerHTML) closeLayer();
    if ($("vPrev") && e.key === "ArrowLeft") $("vPrev").click();
    if ($("vNext") && e.key === "ArrowRight") $("vNext").click();
  });

  renderAll();
})();
</script>
</body>
</html>
