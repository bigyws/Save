<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>콕태그 추억 앨범</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: tinted cover band → profile card overlapping it → sticky section tabs → photo grid, videos, timeline */
:root {
  --bg: #f7f8fc; --surface: #ffffff; --ink: #242638; --muted: #6b6f86; --line: #e3e6f0;
  --accent: #ff6f61; --accent-ink: #ffffff;
  --tint-dog: #ffe1c4; --tint-cat: #d9edff; --tint-dog-ink: #8a4c1f; --tint-cat-ink: #2c5785;
  --font-display: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --radius: 18px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15161f; --surface: #1f2130; --ink: #eceef8; --muted: #a1a5bd; --line: #30344a;
    --accent: #ff8a7e; --accent-ink: #2a0e0a;
    --tint-dog: #3d2b1d; --tint-cat: #1b2c42; --tint-dog-ink: #ffcf9f; --tint-cat-ink: #a9d2ff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15161f; --surface: #1f2130; --ink: #eceef8; --muted: #a1a5bd; --line: #30344a;
  --accent: #ff8a7e; --accent-ink: #2a0e0a;
  --tint-dog: #3d2b1d; --tint-cat: #1b2c42; --tint-dog-ink: #ffcf9f; --tint-cat-ink: #a9d2ff;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.6; }
body[data-kind="dog"] { --tint: var(--tint-dog); --tint-ink: var(--tint-dog-ink); }
body[data-kind="cat"] { --tint: var(--tint-cat); --tint-ink: var(--tint-cat-ink); }
.wrap { max-width: 960px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; margin: 0; text-wrap: balance; line-height: 1.2; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 8px; }

/* cover */
.cover {
  background-color: var(--tint);
  background-image: radial-gradient(circle at 20px 20px, color-mix(in srgb, var(--tint-ink) 14%, transparent) 5px, transparent 6px);
  background-size: 56px 56px;
  padding-block: 18px 90px;
}
.cover .wrap { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.brand { font-family: var(--font-display); font-size: 20px; color: var(--tint-ink); text-decoration: none; }
.tapnote { font-size: 13px; color: var(--tint-ink); background: color-mix(in srgb, var(--surface) 70%, transparent); padding: 5px 12px; border-radius: 999px; }

/* profile */
.profile {
  margin-top: -70px; background: var(--surface); border: 1px solid var(--line); border-radius: 24px;
  padding: 22px; display: grid; grid-template-columns: auto 1fr; gap: 22px; align-items: center;
  box-shadow: 0 12px 30px rgba(20, 22, 40, .07);
}
.avatar { width: 136px; height: 136px; border-radius: 50%; background: var(--tint); display: grid; place-items: center; overflow: hidden; border: 4px solid var(--surface); box-shadow: 0 0 0 2px var(--line); }
.avatar svg { width: 112%; height: 112%; margin-top: 10%; }
.p-main { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.p-name { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.p-name h1 { font-size: clamp(32px, 6vw, 44px); }
.p-name span { color: var(--muted); font-size: 15px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font-size: 14px; background: var(--tint); color: var(--tint-ink); border-radius: 999px; padding: 4px 12px; font-variant-numeric: tabular-nums; }
.msg { margin: 0; color: var(--ink); font-size: 16px; border-left: 3px solid var(--tint-ink); padding-left: 12px; }
.msg cite { display: block; font-style: normal; font-size: 13px; color: var(--muted); margin-top: 2px; }
.p-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 0; border-radius: 12px; padding: 10px 16px; cursor: pointer; font-family: var(--font-display); font-size: 17px; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; border: 1.5px solid var(--line); }
.btn.ghost:hover { border-color: var(--muted); }
.heart { color: var(--accent); }
.heart.pop { animation: heartpop .4s; }
@keyframes heartpop { 50% { transform: scale(1.5); } }

/* tabs */
.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); margin-top: 20px; border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.tabs .wrap { display: flex; gap: 4px; overflow-x: auto; }
.tabs a { padding: 12px 14px; color: var(--muted); text-decoration: none; font-family: var(--font-display); font-size: 17px; white-space: nowrap; border-bottom: 3px solid transparent; }
.tabs a:hover { color: var(--ink); }
.tabs a.on { color: var(--ink); border-bottom-color: var(--accent); }

section { padding-block: 28px 8px; scroll-margin-top: 60px; }
.sec-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.sec-head h2 { font-size: 26px; }
.sec-head span { color: var(--muted); font-size: 14px; }

/* photos */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
.ph { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column; text-align: left; padding: 0; cursor: zoom-in; position: relative; }
.ph .img { aspect-ratio: 1; max-width: 100%; overflow: hidden; background: var(--tint); }
.ph .img svg, .ph .img img, .ph .img video { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .3s; }
.ph:hover .img svg, .ph:hover .img img { transform: scale(1.04); }
.ph .cap { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.ph .cap b { font-weight: 400; font-family: var(--font-display); font-size: 16px; }
.ph .cap small { color: var(--muted); font-variant-numeric: tabular-nums; }
.mine { position: absolute; top: 8px; left: 8px; background: var(--accent); color: var(--accent-ink); font-size: 12px; padding: 2px 9px; border-radius: 999px; font-family: var(--font-display); }
.del { position: absolute; top: 6px; right: 6px; width: 30px; height: 30px; border-radius: 50%; border: 0; background: rgba(0,0,0,.55); color: #fff; cursor: pointer; font-size: 16px; line-height: 1; }

/* videos */
.vgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.vid { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; position: relative; }
.vid .screen { position: relative; aspect-ratio: 4 / 3; max-width: 100%; background: #000; overflow: hidden; }
.vid .screen svg, .vid .screen video { width: 100%; height: 100%; display: block; object-fit: cover; }
.vid.paused .screen svg * { animation-play-state: paused !important; }
.play { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(0,0,0,.18); border: 0; cursor: pointer; }
.play i { width: 64px; height: 64px; border-radius: 50%; background: rgba(255,255,255,.92); display: grid; place-items: center; }
.play i::before { content: ""; border-left: 20px solid #242638; border-top: 12px solid transparent; border-bottom: 12px solid transparent; margin-left: 5px; }
.vid:not(.paused) .play { background: transparent; }
.vid:not(.paused) .play i { opacity: 0; }
.dur { position: absolute; right: 8px; bottom: 8px; background: rgba(0,0,0,.65); color: #fff; font-size: 12px; padding: 1px 7px; border-radius: 6px; font-variant-numeric: tabular-nums; }
.sample { position: absolute; left: 8px; top: 8px; background: rgba(255,255,255,.9); color: #242638; font-size: 11px; padding: 1px 8px; border-radius: 6px; }
.vid .cap { padding: 10px 12px 12px; }
.vid .cap b { font-weight: 400; font-family: var(--font-display); font-size: 16px; display: block; }
.vid .cap small { color: var(--muted); }

/* timeline */
.tl { list-style: none; margin: 0; padding: 0; position: relative; display: grid; gap: 18px; }
.tl::before { content: ""; position: absolute; left: 27px; top: 8px; bottom: 8px; width: 2px; background: var(--line); }
.tl li { display: grid; grid-template-columns: 56px 1fr; gap: 14px; align-items: start; }
.tl .dot { width: 56px; height: 56px; border-radius: 50%; overflow: hidden; border: 3px solid var(--surface); box-shadow: 0 0 0 2px var(--tint-ink); position: relative; background: var(--tint); }
.tl .dot svg { width: 100%; height: 100%; display: block; }
.tl .body { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 16px; min-width: 0; }
.tl time { font-size: 13px; color: var(--tint-ink); font-variant-numeric: tabular-nums; }
.tl h3 { font-size: 19px; margin: 2px 0 4px; }
.tl p { margin: 0; color: var(--muted); }

/* footer */
.cta { margin-block: 36px 24px; background: var(--tint); border-radius: 24px; padding: 26px; display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
.cta h2 { font-size: 24px; color: var(--tint-ink); }
.cta p { margin: 4px 0 0; color: var(--tint-ink); opacity: .85; }
.samples { text-align: center; color: var(--muted); font-size: 14px; padding-bottom: 28px; }
.samples a { color: var(--ink); }

/* dialogs */
dialog { border: 0; border-radius: 22px; padding: 0; background: var(--surface); color: var(--ink); max-width: min(560px, calc(100vw - 32px)); width: 100%; }
dialog::backdrop { background: rgba(10, 10, 20, .6); }
.lb-img { aspect-ratio: 1; max-width: 100%; background: var(--tint); }
.lb-img svg, .lb-img img, .lb-img video { width: 100%; height: 100%; object-fit: contain; display: block; }
.lb-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; }
.lb-bar div { min-width: 0; }
.lb-bar b { font-family: var(--font-display); font-weight: 400; font-size: 18px; display: block; }
.lb-bar small { color: var(--muted); }
.iconbtn { width: 40px; height: 40px; border-radius: 50%; border: 1.5px solid var(--line); background: transparent; cursor: pointer; font-size: 18px; flex: none; }
.form { padding: 20px; display: grid; gap: 14px; }
.form h2 { font-size: 24px; }
.form label { display: grid; gap: 6px; font-size: 14px; color: var(--muted); }
.form input { font: inherit; color: var(--ink); background: var(--bg); border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.drop { border: 2px dashed var(--line); border-radius: 16px; padding: 18px; text-align: center; color: var(--muted); cursor: pointer; }
.drop.has { border-color: var(--accent); color: var(--ink); }
.form .row { display: flex; gap: 8px; justify-content: flex-end; }
.note { font-size: 13px; color: var(--muted); margin: 0; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-size: 14px; z-index: 20; }

@media (max-width: 560px) {
  .profile { grid-template-columns: 1fr; text-align: center; justify-items: center; padding: 18px; }
  .p-name, .chips, .p-actions { justify-content: center; }
  .msg { border-left: 0; padding-left: 0; }
  .avatar { width: 112px; height: 112px; }
  .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } .heart.pop { animation: none; } }
</style>
</head>
<body data-kind="dog">
<header class="cover">
  <div class="wrap">
    <a class="brand" href="index.html">콕태그</a>
    <span class="tapnote">키링을 콕! 대서 열린 추억 앨범이에요</span>
  </div>
</header>

<main class="wrap">
  <div class="profile">
    <div class="avatar" id="avatar"></div>
    <div class="p-main">
      <div class="p-name"><h1 id="pName">초코</h1><span id="pBreed"></span></div>
      <div class="chips" id="chips"></div>
      <blockquote class="msg" id="pMsg"></blockquote>
      <div class="p-actions">
        <button class="btn primary" id="addBtn" type="button">＋ 추억 추가하기</button>
        <button class="btn ghost" id="likeBtn" type="button"><span class="heart" id="heart">♥</span> <span id="likeLabel">하트 보내기</span></button>
        <button class="btn ghost" id="shareBtn" type="button">링크 복사</button>
      </div>
    </div>
  </div>
</main>

<nav class="tabs" aria-label="앨범 메뉴">
  <div class="wrap">
    <a href="#photos" class="on" data-sec="photos">사진</a>
    <a href="#videos" data-sec="videos">영상</a>
    <a href="#story" data-sec="story">우리 이야기</a>
  </div>
</nav>

<div class="wrap">
  <section id="photos">
    <div class="sec-head"><h2>사진첩</h2><span id="photoCount"></span></div>
    <div class="grid" id="photoGrid"></div>
  </section>
  <section id="videos">
    <div class="sec-head"><h2>영상</h2><span>눌러서 재생</span></div>
    <div class="vgrid" id="videoGrid"></div>
  </section>
  <section id="story">
    <div class="sec-head"><h2>우리 이야기</h2><span id="storySub"></span></div>
    <ol class="tl" id="timeline"></ol>
  </section>

  <div class="cta">
    <div><h2>우리 아이 추억도 키링에 담아보세요</h2><p>사진과 영상을 보내주시면 키링 하나로 언제든 꺼내볼 수 있어요.</p></div>
    <a class="btn primary" href="index.html">키링 만들러 가기</a>
  </div>
  <p class="samples">샘플 앨범 보기: <a href="memory.html?pet=choco#choco" data-pet="choco">강아지 초코</a> · <a href="memory.html?pet=nabi#nabi" data-pet="nabi">고양이 나비</a></p>
</div>

<dialog id="lightbox" aria-label="사진 크게 보기">
  <div class="lb-img" id="lbImg"></div>
  <div class="lb-bar">
    <button class="iconbtn" id="lbPrev" type="button" aria-label="이전 사진">‹</button>
    <div><b id="lbCap"></b><small id="lbDate"></small></div>
    <button class="iconbtn" id="lbNext" type="button" aria-label="다음 사진">›</button>
    <button class="iconbtn" id="lbClose" type="button" aria-label="닫기">✕</button>
  </div>
</dialog>

<dialog id="addDialog" aria-label="추억 추가">
  <form class="form" id="addForm" method="dialog">
    <h2>추억 추가하기</h2>
    <label class="drop" id="drop" for="file">
      <span id="dropText">여기를 눌러 사진이나 영상을 고르세요</span>
      <input id="file" type="file" accept="image/*,video/*" multiple hidden>
    </label>
    <label for="caption">한 줄 설명<input id="caption" type="text" maxlength="40" placeholder="예: 처음 눈 본 날"></label>
    <label for="date">날짜<input id="date" type="date"></label>
    <p class="note">미리보기에서는 이 휴대폰(브라우저)에만 저장돼요. 실제 서비스에서는 서버에 올라가 키링을 대는 모든 사람이 볼 수 있어요.</p>
    <div class="row">
      <button class="btn ghost" type="button" id="addCancel">취소</button>
      <button class="btn primary" type="submit" id="addSave">저장하기</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" hidden></div>

<script src="art.js"></script>
<script src="data.js"></script>
<script src="store.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const A = window.KokArt, D = window.KOK, S = window.KokStore;

  function petId() {
    const h = location.hash.slice(1);
    if (D.pets[h]) return h;
    const q = new URLSearchParams(location.search).get("pet");
    return D.pets[q] ? q : "choco";
  }
  let id = petId(), pet = D.pets[id];
  let lbItems = [], lbIndex = 0, urls = [];

  const dot = (d) => d.replace(/-/g, ".");
  const daysSince = (d) => Math.floor((Date.now() - new Date(d + "T00:00:00")) / 86400000);
  function age(b) {
    const t = new Date(), d = new Date(b + "T00:00:00");
    let y = t.getFullYear() - d.getFullYear();
    if (t < new Date(t.getFullYear(), d.getMonth(), d.getDate())) y--;
    return y;
  }
  function toast(msg) { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => (t.hidden = true), 2200); }
  function media(item, opts) {
    if (item.blob) {
      const u = URL.createObjectURL(item.blob); urls.push(u);
      return item.type === "video" ? `<video src="${u}" ${opts && opts.controls ? "controls autoplay" : "muted"} playsinline></video>` : `<img src="${u}" alt="${item.caption || "추억 사진"}">`;
    }
    if (item.src) return /\.(mp4|webm|mov)$/i.test(item.src) ? `<video src="${item.src}" controls playsinline></video>` : `<img src="${item.src}" alt="${item.caption || ""}">`;
    return A.photoSVG(pet.kind, item.scene, { date: item.date, animate: opts && opts.animate });
  }
  const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  async function render() {
    urls.forEach(URL.revokeObjectURL); urls = [];
    document.body.dataset.kind = pet.kind;
    document.title = pet.name + "의 추억 앨범 · 콕태그";
    $("avatar").innerHTML = `<svg viewBox="0 0 300 300">${A.petArt(pet.kind, { mood: "open" })}</svg>`;
    $("pName").textContent = pet.name;
    $("pBreed").textContent = pet.breed;
    const mine = await S.list(id);
    const myPhotos = mine.filter((m) => m.type === "photo"), myVideos = mine.filter((m) => m.type === "video");
    const total = pet.photos.length + pet.videos.length + mine.length;
    $("chips").innerHTML = `<span class="chip">${age(pet.birthday)}살 · ${dot(pet.birthday)}생</span>
      <span class="chip">함께한 지 ${daysSince(pet.together).toLocaleString()}일</span><span class="chip">추억 ${total}개</span>`;
    $("pMsg").innerHTML = `${esc(pet.message)}<cite>— ${esc(pet.owner)}</cite>`;
    $("likeLabel").textContent = S.likes(id) ? `하트 ${S.likes(id)}` : "하트 보내기";

    // photos
    lbItems = [...myPhotos.map((m) => ({ ...m, mine: true })), ...pet.photos];
    $("photoCount").textContent = lbItems.length + "장";
    $("photoGrid").innerHTML = lbItems.map((p, i) => `
      <button class="ph" type="button" data-i="${i}" aria-label="${esc(p.caption || "사진")} 크게 보기">
        <div class="img">${media(p)}</div>
        <div class="cap"><b>${esc(p.caption || "새 추억")}</b><small>${dot(p.date)}</small></div>
        ${p.mine ? `<span class="mine">내가 올림</span><span class="del" role="button" tabindex="0" data-del="${p.id}" aria-label="삭제">✕</span>` : ""}
      </button>`).join("");

    // videos
    const vids = [...myVideos.map((m) => ({ ...m, mine: true })), ...pet.videos];
    $("videoGrid").innerHTML = vids.map((v, i) => v.blob || v.src
      ? `<div class="vid"><div class="screen">${media(v, { controls: true }).replace(" autoplay", "")}</div>
          ${v.mine ? `<span class="mine">내가 올림</span><button class="del" type="button" data-del="${v.id}" aria-label="삭제">✕</button>` : ""}
          <div class="cap"><b>${esc(v.caption || v.title || "새 영상")}</b><small>${dot(v.date)}</small></div></div>`
      : `<div class="vid paused" data-v="${i}"><div class="screen">${A.photoSVG(pet.kind, v.scene, { animate: true })}
          <span class="sample">샘플 영상</span><span class="dur">${v.duration}</span>
          <button class="play" type="button" aria-label="${esc(v.title)} 재생"><i></i></button></div>
          <div class="cap"><b>${esc(v.title)}</b><small>${dot(v.date)}</small></div></div>`).join("");

    // timeline
    $("storySub").textContent = dot(pet.together) + "부터 지금까지";
    $("timeline").innerHTML = pet.timeline.map((t) => `
      <li><div class="dot">${A.photoSVG(pet.kind, t.scene)}</div>
        <div class="body"><time datetime="${t.date}">${dot(t.date)}</time><h3>${esc(t.title)}</h3><p>${esc(t.text)}</p></div></li>`).join("");
  }

  // events
  $("photoGrid").addEventListener("click", async (e) => {
    const del = e.target.closest("[data-del]");
    if (del) { e.stopPropagation(); await S.remove(del.dataset.del); toast("삭제했어요"); render(); return; }
    const b = e.target.closest(".ph"); if (b) openLb(Number(b.dataset.i));
  });
  $("videoGrid").addEventListener("click", async (e) => {
    const del = e.target.closest("[data-del]");
    if (del) { await S.remove(del.dataset.del); toast("삭제했어요"); render(); return; }
    const v = e.target.closest(".vid[data-v]"); if (v && e.target.closest(".play")) v.classList.toggle("paused");
  });

  function openLb(i) {
    lbIndex = (i + lbItems.length) % lbItems.length;
    const p = lbItems[lbIndex];
    $("lbImg").innerHTML = media(p, { controls: true });
    $("lbCap").textContent = p.caption || "새 추억";
    $("lbDate").textContent = dot(p.date);
    if (!$("lightbox").open) $("lightbox").showModal();
  }
  $("lbPrev").onclick = () => openLb(lbIndex - 1);
  $("lbNext").onclick = () => openLb(lbIndex + 1);
  $("lbClose").onclick = () => $("lightbox").close();
  $("lightbox").addEventListener("click", (e) => { if (e.target === $("lightbox")) $("lightbox").close(); });
  document.addEventListener("keydown", (e) => {
    if (!$("lightbox").open) return;
    if (e.key === "ArrowLeft") openLb(lbIndex - 1);
    if (e.key === "ArrowRight") openLb(lbIndex + 1);
  });

  $("likeBtn").onclick = () => {
    const n = S.like(id);
    $("likeLabel").textContent = "하트 " + n;
    const h = $("heart"); h.classList.remove("pop"); void h.offsetWidth; h.classList.add("pop");
  };
  $("shareBtn").onclick = async () => {
    const url = location.href.split("#")[0].split("?")[0] + "?pet=" + id;
    try { await navigator.clipboard.writeText(url); toast("링크를 복사했어요"); }
    catch (_) { toast(url); }
  };

  // add memory
  let files = [];
  $("addBtn").onclick = () => { files = []; $("addForm").reset(); $("date").value = new Date().toISOString().slice(0, 10); $("dropText").textContent = "여기를 눌러 사진이나 영상을 고르세요"; $("drop").classList.remove("has"); $("addDialog").showModal(); };
  $("addCancel").onclick = () => $("addDialog").close();
  $("file").onchange = (e) => {
    files = [...e.target.files];
    $("dropText").textContent = files.length ? `${files.length}개 선택됨: ${files.map((f) => f.name).join(", ").slice(0, 60)}` : "여기를 눌러 사진이나 영상을 고르세요";
    $("drop").classList.toggle("has", files.length > 0);
  };
  $("addForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!files.length) { toast("사진이나 영상을 먼저 골라주세요"); return; }
    try {
      for (const f of files) await S.add(id, f, $("caption").value.trim(), $("date").value);
      $("addDialog").close(); toast(`추억 ${files.length}개를 저장했어요`); render();
    } catch (_) { toast("이 브라우저에서는 저장할 수 없어요. 일반 창에서 다시 시도해 주세요."); }
  });

  // tabs highlight
  const secs = ["photos", "videos", "story"].map((s) => $(s));
  const tabs = [...document.querySelectorAll(".tabs a")];
  tabs.forEach((a) => a.addEventListener("click", (e) => { e.preventDefault(); $(a.dataset.sec).scrollIntoView({ behavior: "smooth" }); }));
  addEventListener("scroll", () => {
    let cur = "photos";
    secs.forEach((s) => { if (s.getBoundingClientRect().top < 140) cur = s.id; });
    tabs.forEach((a) => a.classList.toggle("on", a.dataset.sec === cur));
  }, { passive: true });

  document.querySelectorAll("[data-pet]").forEach((a) => a.addEventListener("click", (e) => {
    e.preventDefault(); id = a.dataset.pet; pet = D.pets[id];
    try { history.replaceState(null, "", "#" + id); } catch (_) {}
    render(); scrollTo({ top: 0, behavior: "smooth" });
  }));
  addEventListener("hashchange", () => { const n = petId(); if (n !== id) { id = n; pet = D.pets[id]; render(); } });

  render();
})();
</script>
</body>
</html>
